<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./images/weather-icon.png"/>
    <link rel="stylesheet" href="style.css"/>
    <title>Weather app</title>
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" spellchecker=false  placeholder="enter city name"/>
           <button><img src="./images/search.png" alt="search" /></button>
        </div>
        <div class="weather">
            <img src="./images/rain.png" alt="weather icon" class="weather-icon"/>
            <h1 class="temp">20°c</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="">

                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png" alt="">

                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>

<script>
    const apiKey="259b4cd6ec6085db9f8c6db85eaad0e1"
    const input=document.querySelector(".search input")
    const searchButton=document.querySelector('.search button')

    const apiUrl=`https://api.openweathermap.org/data/2.5/weather?units=metric&`
    
    const checkWeather=async(city)=>{
        const response=await fetch(apiUrl+city+`&appid=${apiKey}`)
        var data=await response.json();
        console.log(data)
        document.querySelector('.city').innerText=data.name
        document.querySelector(".temp").innerText=Math.round(data.main.temp)+"°c"
        document.querySelector(".wind").innerText=data.wind.speed+" km/h"
        document.querySelector(".humidity").innerText=data.main.humidity+" %"
        
    }
    searchButton.addEventListener("click",()=>{
        checkWeather("q="+input.value)
    })
    

</script>
</body>
</html>
